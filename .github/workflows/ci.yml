name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    name: Hook smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run hook tests
        run: python3 tests/test_hooks.py

  manifests:
    name: Manifest versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claude, Codex, and marketplace manifests carry the same version
        run: |
          a=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          b=$(python3 -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          c=$(python3 -c "import json;print(json.load(open('.codex-plugin/plugin.json'))['version'])")
          echo "claude=$a codex=$c marketplace=$b"
          test "$a" = "$b"
          test "$a" = "$c"

  stdlib-only:
    name: Hooks are stdlib-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No third-party imports in hooks/
        run: |
          ! grep -rEn "^\s*(import|from)\s+(requests|yaml|toml|click|rich|pydantic)" hooks/
